<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Itinerary">
<title>Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d0f;
    --card: #16181c;
    --text: #f4f1ea;
    --muted: #a8a29e;
    --dim: #78716c;
    --accent: #c9a96e;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    line-height: 1.5;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding: 1rem 1rem 3rem; }
  .app { max-width: 900px; margin: 0 auto; }
  header {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
  .logo { font-family: "Instrument Serif", serif; font-size: 1.7rem; }
  .logo span { color: var(--accent); }
  .levels { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .levels button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.5rem 0.9rem;
    border-radius: 100px;
    font-size: 0.8rem;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .levels button.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(201,169,110,0.12);
  }
  .actions { display: flex; gap: 0.5rem; }
  button.primary, button.ghost {
    padding: 0.55rem 1rem;
    border-radius: 100px;
    font-size: 0.85rem;
    cursor: pointer;
    -webkit-appearance: none;
  }
  button.primary { background: var(--accent); color: #0c0d0f; border: none; font-weight: 500; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    margin-bottom: 1rem;
  }
  h2 {
    font-family: "Instrument Serif", serif;
    font-size: 1.35rem;
    font-weight: 400;
    margin-bottom: 1rem;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
  label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.35rem; }
  input, textarea {
    width: 100%;
    background: #0c0d0f;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.7rem 0.8rem;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    -webkit-appearance: none;
  }
  textarea { min-height: 80px; resize: vertical; }
  .hidden { display: none !important; }
  .note { font-size: 0.75rem; color: var(--dim); text-align: center; margin-top: 1.5rem; line-height: 1.4; }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top-row">
      <div class="logo">Itiner<span>ary</span></div>
      <div class="actions">
        <button class="ghost" id="reset">New trip</button>
        <button class="primary" id="export">Export</button>
      </div>
    </div>
    <div class="levels">
      <button data-level="Essential">Essential</button>
      <button data-level="Planned" class="active">Planned</button>
      <button data-level="Complete">Complete</button>
    </div>
  </header>

  <section data-min="Essential">
    <h2>Trip basics</h2>
    <div class="grid">
      <div><label>Departure city</label><input id="origin" placeholder="Melbourne"></div>
      <div><label>Destination</label><input id="destination" placeholder="Rome"></div>
      <div><label>Outbound date</label><input id="outbound" type="date"></div>
      <div><label>Return / duration</label><input id="returnDate" placeholder="12 Oct or 10 days"></div>
    </div>
  </section>

  <section data-min="Essential">
    <h2>Bookings</h2>
    <div class="grid">
      <div><label>Flight</label><input id="flight" placeholder="Airline, number, confirmation"></div>
      <div><label>Hotel</label><input id="hotel" placeholder="Name and address"></div>
      <div data-min="Planned"><label>Restaurant</label><input id="restaurant" placeholder="Name, time, confirmation"></div>
      <div data-min="Planned"><label>Taxi / private driver</label><input id="taxi" placeholder="Company, contact, pickup time"></div>
    </div>
  </section>

  <section data-min="Planned">
    <h2>Packing</h2>
    <div class="grid">
      <div><label>Socks</label><input id="socks" placeholder="8 pairs"></div>
      <div><label>Underwear</label><input id="underwear" placeholder="7 pairs"></div>
      <div data-min="Complete"><label>Tops / polos</label><input id="tops" placeholder="3 navy"></div>
      <div data-min="Complete"><label>Packing cubes</label><textarea id="cubes" placeholder="Cube 1: socks + underwear&#10;Cube 2: tops"></textarea></div>
    </div>
  </section>

  <section data-min="Planned">
    <h2>Places & movement</h2>
    <div><label>Activities / sights</label><textarea id="activities" placeholder="One per line"></textarea></div>
    <div data-min="Complete" style="margin-top:0.9rem;"><label>Cafes</label><textarea id="cafes" placeholder="One per line"></textarea></div>
    <div class="grid" style="margin-top:0.9rem;">
      <div data-min="Complete"><label>Hotel → restaurant</label><input id="mappingRestaurant" placeholder="12 min walk or taxi"></div>
      <div data-min="Complete"><label>Hotel → activities</label><input id="mappingActivities" placeholder="Walking or transport notes"></div>
    </div>
    <div data-min="Complete" style="margin-top:0.9rem;"><label>Notes</label><textarea id="notes"></textarea></div>
  </section>

  <p class="note">Structured planner with three levels of detail. Data saves automatically.</p>
</div>

<script>
const KEY = "itinerary_ipad_v2";
let level = "Planned";
const ids = ["origin","destination","outbound","returnDate","flight","hotel","restaurant","taxi","socks","underwear","tops","cubes","activities","cafes","mappingRestaurant","mappingActivities","notes"];

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (d.level) level = d.level;
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el && d[id] != null) el.value = d[id];
    });
  } catch(e) {}
  setLevel(level);
}

function save() {
  const d = { level };
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) d[id] = el.value;
  });
  localStorage.setItem(KEY, JSON.stringify(d));
}

function setLevel(l) {
  level = l;
  document.querySelectorAll(".levels button").forEach(b => {
    b.classList.toggle("active", b.dataset.level === l);
  });
  document.querySelectorAll("[data-min]").forEach(el => {
    const min = el.getAttribute("data-min");
    const show = (l === "Complete") ||
                 (l === "Planned" && min !== "Complete") ||
                 (l === "Essential" && min === "Essential");
    el.classList.toggle("hidden", !show);
  });
  save();
}

function doExport() {
  const g = id => (document.getElementById(id)?.value || "—");
  const lines = [
    "Itinerary (" + level + ")",
    "From: " + g("origin"),
    "To: " + g("destination"),
    "Outbound: " + g("outbound"),
    "Return: " + g("returnDate"),
    "",
    "Flight: " + g("flight"),
    "Hotel: " + g("hotel")
  ];
  if (level !== "Essential") {
    lines.push("Restaurant: " + g("restaurant"));
    lines.push("Taxi: " + g("taxi"));
    lines.push("");
    lines.push("Socks: " + g("socks"));
    lines.push("Underwear: " + g("underwear"));
  }
  if (level === "Complete") {
    lines.push("Tops: " + g("tops"));
    lines.push("Cubes: " + g("cubes"));
    lines.push("");
    lines.push("Activities: " + g("activities"));
    lines.push("Cafes: " + g("cafes"));
    lines.push("Hotel → restaurant: " + g("mappingRestaurant"));
    lines.push("Hotel → activities: " + g("mappingActivities"));
    lines.push("Notes: " + g("notes"));
  }
  const blob = new Blob([lines.join("\n")], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "itinerary.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.querySelectorAll(".levels button").forEach(b => {
  b.addEventListener("click", () => setLevel(b.dataset.level));
});
document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Clear this trip?")) {
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = "";
    });
    setLevel("Planned");
  }
});
document.getElementById("export").addEventListener("click", doExport);
ids.forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener("input", save);
});

load();
</script>
</body>
</html>
